<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Mi primera pagina web - Hola Mundo" />
  <title>Hola Mundo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      overflow: hidden;
    }
    .bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 20% 50%, hsla(265,80%,25%,.4) 0%,transparent 60%),
                  radial-gradient(ellipse at 80% 20%, hsla(200,80%,20%,.3) 0%,transparent 50%),
                  radial-gradient(ellipse at 60% 80%, hsla(320,70%,20%,.3) 0%,transparent 50%);
      z-index: 0;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .5;
      animation: float 8s ease-in-out infinite;
    }
    .orb-1 { width:500px;height:500px;background:hsla(265,90%,55%,.3);top:-150px;left:-150px;animation-delay:0s; }
    .orb-2 { width:400px;height:400px;background:hsla(200,90%,55%,.25);bottom:-100px;right:-100px;animation-delay:-4s; }
    .orb-3 { width:300px;height:300px;background:hsla(320,90%,60%,.2);top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:-2s; }
    @keyframes float { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-30px) scale(1.05)} }
    .orb-3 { animation-name: float3; }
    @keyframes float3 { 0%,100%{transform:translate(-50%,-50%) translateY(0) scale(1)} 50%{transform:translate(-50%,-50%) translateY(-30px) scale(1.05)} }
    .card {
      position:relative;z-index:1;text-align:center;
      padding:3rem 4rem;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.1);
      border-radius:24px;
      backdrop-filter:blur(20px);
      box-shadow:0 25px 50px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
      animation:fadeIn 1s ease both;
    }
    @keyframes fadeIn { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    .emoji { font-size:4rem;display:block;margin-bottom:1rem;animation:wave 2s ease-in-out infinite;transform-origin:70% 70%; }
    @keyframes wave { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-15deg)} 40%{transform:rotate(10deg)} 60%{transform:rotate(-10deg)} 80%{transform:rotate(5deg)} }
    h1 {
      font-size:clamp(2.5rem,6vw,4rem);font-weight:900;
      background:linear-gradient(135deg,#a78bfa,#60a5fa,#f472b6);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      letter-spacing:-1px;margin-bottom:1rem;
      animation:fadeIn 1s .2s ease both;
    }
    p { color:rgba(255,255,255,.5);font-size:1.1rem;margin-bottom:2rem;animation:fadeIn 1s .4s ease both; }
    .badge {
      display:inline-block;padding:.4rem 1.2rem;border-radius:999px;
      font-size:.85rem;font-weight:700;
      background:linear-gradient(135deg,#7c3aed,#2563eb);
      color:white;letter-spacing:.05em;text-transform:uppercase;
      animation:fadeIn 1s .6s ease both;
      box-shadow:0 0 20px rgba(124,58,237,.4);
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <main class="card">
    <span class="emoji" role="img" aria-label="Mano saludando">&#128075;</span>
    <h1>&#161;Hola Mundo!</h1>
    <p>Prueba de pagina web &middot; Aplicaciones Web IAW</p>
    <span class="badge">2&ordm; ASIR</span>
  </main>
</body>
</html>
